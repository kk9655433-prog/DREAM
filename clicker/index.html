<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四欄乘積計算器</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:min(1000px,95%);
    text-align:center;
    padding:20px;
}

.title{
    font-size:1.8rem;
    margin-bottom:10px;
}

.total{
    font-size:3rem;
    font-weight:bold;
    margin-bottom:50px;

    cursor:pointer;
    user-select:none;
    transition:.2s;
}

.total:hover{
    opacity:.8;
}

.counters{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
}

.counter{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}

.number{
    width:100%;
    max-width:130px;

    background:#111;
    color:#fff;

    border:2px solid #fff;
    border-radius:10px;

    text-align:center;

    font-size:2rem;
    font-weight:bold;

    padding:12px;
}

.number:focus{
    outline:none;
    box-shadow:0 0 10px rgba(255,255,255,.3);
}

button{
    background:#2d2d2d;
    color:#fff;

    border:none;
    border-radius:8px;

    cursor:pointer;

    transition:.2s;
}

button:hover{
    background:#444;
}

.click-btn{
    width:120px;
    height:48px;
    font-size:1rem;
}

.reset-btn{
    width:80px;
    height:34px;
    font-size:.8rem;
    opacity:.85;
}

.reset-all{
    margin-top:45px;

    width:200px;
    height:50px;

    font-size:1rem;
}

.toast{
    position:fixed;

    left:50%;
    bottom:40px;

    transform:translateX(-50%);

    background:#222;
    color:#fff;

    padding:12px 20px;

    border-radius:10px;

    opacity:0;
    pointer-events:none;

    transition:.4s;
}

.toast.show{
    opacity:1;
}

@media (max-width:700px){

    .counters{
        grid-template-columns:repeat(2,1fr);

        row-gap:60px;   /* 拉大上下兩排距離 */
        column-gap:20px;
    }

    .total{
        font-size:2rem;
        margin-bottom:60px;
    }

    .number{
        font-size:1.7rem;
    }

    .click-btn{
        width:110px;
        height:46px;
    }

    .reset-btn{
        width:75px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="title">總數：</div>

    <div
        class="total"
        id="total"
        onclick="copyTotal()"
        title="點擊複製">
        0
    </div>

    <div class="counters">

        <div class="counter">
            <input type="number" class="number" id="num0" value="0" oninput="update()">
            <button class="click-btn" onclick="add(0)">點擊</button>
            <button class="reset-btn" onclick="resetOne(0)">歸零</button>
        </div>

        <div class="counter">
            <input type="number" class="number" id="num1" value="0" oninput="update()">
            <button class="click-btn" onclick="add(1)">點擊</button>
            <button class="reset-btn" onclick="resetOne(1)">歸零</button>
        </div>

        <div class="counter">
            <input type="number" class="number" id="num2" value="0" oninput="update()">
            <button class="click-btn" onclick="add(2)">點擊</button>
            <button class="reset-btn" onclick="resetOne(2)">歸零</button>
        </div>

        <div class="counter">
            <input type="number" class="number" id="num3" value="0" oninput="update()">
            <button class="click-btn" onclick="add(3)">點擊</button>
            <button class="reset-btn" onclick="resetOne(3)">歸零</button>
        </div>

    </div>

    <button
        class="reset-all"
        onclick="resetAll()">
        一鍵歸零
    </button>

</div>

<div class="toast" id="toast">
    已複製
</div>

<script>

function getValues(){

    return [

        Number(document.getElementById("num0").value) || 0,
        Number(document.getElementById("num1").value) || 0,
        Number(document.getElementById("num2").value) || 0,
        Number(document.getElementById("num3").value) || 0

    ];
}

function update(){

    const values = getValues();

    const total =
        values[0] *
        values[1] *
        values[2] *
        values[3];

    document.getElementById("total").textContent = total;
}

function add(index){

    const input =
        document.getElementById("num" + index);

    input.value =
        Number(input.value || 0) + 1;

    update();
}

function resetOne(index){

    document.getElementById("num"+index).value = 0;

    update();
}

function resetAll(){

    for(let i=0;i<4;i++){

        document.getElementById("num"+i).value = 0;
    }

    update();
}

async function copyTotal(){

    const text =
        document.getElementById("total").textContent;

    await navigator.clipboard.writeText(text);

    const toast =
        document.getElementById("toast");

    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },1000);
}

update();

</script>

</body>
</html>
