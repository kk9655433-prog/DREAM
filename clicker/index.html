<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四欄乘積計算器</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:min(1000px,95%);
    text-align:center;
    padding:20px;
}

.title{
    font-size:1.8rem;
    margin-bottom:10px;
}

.total{
    font-size:3rem;
    font-weight:bold;
    margin-bottom:40px;
    word-break:break-all;
}

.counters{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.counter{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.number{
    width:100%;
    max-width:120px;

    background:#111;
    color:#fff;

    border:2px solid #fff;
    border-radius:8px;

    text-align:center;

    font-size:2rem;
    font-weight:bold;

    padding:10px;
}

.number:focus{
    outline:none;
    box-shadow:0 0 10px rgba(255,255,255,.4);
}

button{
    width:100%;
    max-width:120px;

    padding:12px;

    border:2px solid #fff;
    border-radius:8px;

    background:#000;
    color:#fff;

    cursor:pointer;

    font-size:1rem;

    transition:.2s;
}

button:hover{
    background:#fff;
    color:#000;
}

.reset-all{
    margin-top:40px;
    width:220px;
}

@media (max-width:700px){

    .counters{
        grid-template-columns:repeat(2,1fr);
    }

    .total{
        font-size:2rem;
    }

    .number{
        font-size:1.5rem;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="title">總數：</div>
    <div class="total" id="total">0</div>

    <div class="counters">

        <div class="counter">
            <input type="number" class="number" id="num0" value="0" min="0" oninput="update()">
            <button onclick="add(0)">點擊</button>
            <button onclick="resetOne(0)">歸零</button>
        </div>

        <div class="counter">
            <input type="number" class="number" id="num1" value="0" min="0" oninput="update()">
            <button onclick="add(1)">點擊</button>
            <button onclick="resetOne(1)">歸零</button>
        </div>

        <div class="counter">
            <input type="number" class="number" id="num2" value="0" min="0" oninput="update()">
            <button onclick="add(2)">點擊</button>
            <button onclick="resetOne(2)">歸零</button>
        </div>

        <div class="counter">
            <input type="number" class="number" id="num3" value="0" min="0" oninput="update()">
            <button onclick="add(3)">點擊</button>
            <button onclick="resetOne(3)">歸零</button>
        </div>

    </div>

    <button class="reset-all" onclick="resetAll()">
        一鍵歸零
    </button>

</div>

<script>

function getValues(){
    return [
        Number(document.getElementById("num0").value) || 0,
        Number(document.getElementById("num1").value) || 0,
        Number(document.getElementById("num2").value) || 0,
        Number(document.getElementById("num3").value) || 0
    ];
}

function update(){

    const values = getValues();

    const total =
        values[0] *
        values[1] *
        values[2] *
        values[3];

    document.getElementById("total").textContent =
        total.toLocaleString();
}

function add(index){

    const input =
        document.getElementById("num" + index);

    input.value =
        Number(input.value || 0) + 1;

    update();
}

function resetOne(index){

    document.getElementById("num" + index).value = 0;

    update();
}

function resetAll(){

    for(let i=0;i<4;i++){
        document.getElementById("num" + i).value = 0;
    }

    update();
}

update();

</script>

</body>
</html>
