<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>우주 쇼핑몰</title>
  <link rel="icon" type="image/png" href="../PT/alien.png">

  <style>
    @font-face{
      font-family:"SamlipHopangcheOutline";
      src:url('./SDSamliphopangcheOutline.otf') format('opentype');
      font-display:swap;
    }

    html,body{
      height:100%;
      margin:0;
      padding:0;
      background:#000;
      font-family: "MingLiU", "PMingLiU", "新細明體", serif;
      color:#FFD93B;
    }

    body{
      background-image: url('../PT/background.gif');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
    }

    .wrap{
      width:100%;
      position:relative;
      z-index:2;
      text-align:center;
      padding:20px;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .title-svg{
      width:min(92vw,2200px);
      height:clamp(120px, 30vh, 580px);
      margin-bottom:20px;
    }

    .products{
      font-size:clamp(18px, 2.6vh, 28px);
      line-height:1.6;
      font-weight:700;
      width:min(92vw, 760px);
    }

    .products .centered{
      text-align:center;
      margin-bottom:20px;
      font-size:clamp(28px, 4vh, 40px);
    }

    .product-row,
    .cart-row,
    .cart-total,
    .discount-total{
      display:grid;
      grid-template-columns:minmax(0, 1fr) max-content;
      gap:18px;
      align-items:baseline;
    }

    .product-row{
      cursor:pointer;
      padding:2px 8px;
      border-radius:5px;
    }

    .product-row:hover{
      background:rgba(255,217,59,0.13);
    }

    .price{
      text-align:right;
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
    }

    .star-wrap{
      position:relative;
      display:inline-block;
      cursor:help;
    }

    .star-tooltip{
      position:absolute;
      left:50%;
      bottom:calc(100% + 8px);
      transform:translateX(-50%);
      display:none;
      width:max-content;
      max-width:80vw;
      padding:7px 11px;
      border:2px solid #2764d8;
      border-radius:4px;
      background:#fff;
      color:#1554c0;
      font-family:"MingLiU", "PMingLiU", serif;
      font-size:16px;
      line-height:1.3;
      z-index:20;
      box-shadow:3px 3px 0 rgba(0,0,0,.45);
    }

    .star-wrap:hover .star-tooltip{
      display:block;
    }

    .vip-message{
      margin-top:34px;
      text-align:center;
      font-family:"SamlipHopangcheOutline", "MingLiU", "PMingLiU", serif;
      font-size:clamp(22px, 3.2vh, 34px);
      line-height:1.45;
    }

    .cart{
      position:fixed;
      top:10px;
      right:10px;
      font-size:clamp(16px, 2vh, 24px);
      font-weight:700;
      background:#FFD93B;
      color:#000;
      padding:8px 16px;
      border-radius:6px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:8px;
      z-index:100;
    }

    .cart img{
      width:24px;
      height:24px;
    }

    .floating-img{
      position:absolute;
      height:auto;
      max-width:40vw;
      z-index:1;
      pointer-events:none;
    }

    .img1{
      width:20vw;
      top:40%;
      right:10%;
    }

    .img3{
      width:28vw;
      top:60%;
      left:5%;
      transform:translateY(-50%);
    }

    /* ====== Modal ====== */

    .modal-overlay{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:999;
    }

    .modal{
      background:#111;
      border:2px solid #FFD93B;
      border-radius:8px;
      width:min(88vw, 620px);
      max-height:82vh;
      overflow:auto;
      padding:20px;
      text-align:center;
      color:#FFD93B;
    }

    .modal button{
      margin:10px;
      padding:6px 16px;
      border:none;
      border-radius:4px;
      cursor:pointer;
      font-weight:bold;
    }

    .btn-yes{
      background:#FFD93B;
      color:#000;
    }

    .btn-no{
      background:#444;
      color:#FFD93B;
    }

    .cart-list{
      margin:16px 0;
      text-align:left;
      line-height:1.55;
    }

    .cart-total{
      margin-top:12px;
      padding-top:8px;
      border-top:1px solid #FFD93B;
    }

    .discount-total{
      margin-top:8px;
      color:#ff4444;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <!-- ===== 購物車 ===== -->

  <div class="cart" onclick="showCart()">
    <img src="../PT/cart_icon.png" alt="購物車圖示">
    장바구니
  </div>


  <div class="wrap">

    <!-- ===== 標題 SVG ===== -->

    <svg
      class="title-svg"
      viewBox="0 0 1200 300"
      preserveAspectRatio="xMidYMid meet"
    >

      <defs>

        <linearGradient
          id="rainbow"
          x1="0%"
          y1="0%"
          x2="100%"
          y2="0%"
        >

          <stop offset="0%" stop-color="#ff3b3b">
            <animate
              attributeName="stop-color"
              values="#ff3b3b;#ff9a3b;#ffd93b;#3bff7a;#3bb8ff;#b33bff;#ff3b3b"
              dur="6s"
              repeatCount="indefinite"
            />
          </stop>

          <stop offset="50%" stop-color="#3bb8ff">
            <animate
              attributeName="stop-color"
              values="#3bb8ff;#b33bff;#ff3b3b;#ff9a3b;#ffd93b;#3bff7a;#3bb8ff"
              dur="6s"
              repeatCount="indefinite"
            />
          </stop>

          <stop offset="100%" stop-color="#b33bff">
            <animate
              attributeName="stop-color"
              values="#b33bff;#ff3b3b;#ff9a3b;#ffd93b;#3bff7a;#3bb8ff;#b33bff"
              dur="6s"
              repeatCount="indefinite"
            />
          </stop>

        </linearGradient>


        <path
          id="arcPath"
          d="M60,190 C300,60 900,60 1140,190"
          fill="none"
        />


        <filter id="glow">

          <feGaussianBlur
            stdDeviation="4"
            result="blur"
          />

          <feMerge>

            <feMergeNode in="blur"/>

            <feMergeNode in="SourceGraphic"/>

          </feMerge>

        </filter>

      </defs>


      <text
        font-family="MingLiU, PMingLiU, 新細明體, serif"
        font-size="120"
        font-weight="700"
        text-anchor="middle"
        filter="url(#glow)"
        fill="url(#rainbow)"
      >

        <textPath
          href="#arcPath"
          startOffset="50%"
          dominant-baseline="middle"
          letter-spacing="2"
        >
          우주 쇼핑몰
        </textPath>

      </text>

    </svg>


    <!-- ===== 商品 ===== -->

    <div class="products">

      <div class="centered">
        물건 목록
      </div>

      <div class="product-row" onclick="openConfirmModal('happy')">
        <span>해피 메이커</span>
        <span class="price">₩27,999,999
          <span class="star-wrap" onclick="event.stopPropagation()">★
            <span class="star-tooltip">★ 이전에 샀던 물건 비슷한!</span>
          </span>
        </span>
      </div>

      <div class="product-row" onclick="openConfirmModal('candy')">
        <span>노스텔지어 캔디</span>
        <span class="price">₩12,999,999
          <span class="star-wrap" onclick="event.stopPropagation()">★
            <span class="star-tooltip">★ 이전에 샀던 물건 비슷한!</span>
          </span>
        </span>
      </div>

      <div class="product-row" onclick="openConfirmModal('wrapper')">
        <span>포장지 12B357나</span>
        <span class="price">₩9,999,999</span>
      </div>

      <div class="product-row" onclick="openConfirmModal('book')">
        <span>네크로노미콘</span>
        <span class="price">₩49,999,999</span>
      </div>

      <div class="product-row" onclick="openConfirmModal('help')">
        <span>우리가 도움!</span>
        <span class="price">₩66,666,666</span>
      </div>

      <div class="vip-message">
        정말 1억 이상 사면 20% 할인!<br>
        우주 쇼핑몰 VIP 된다!
      </div>

    </div>

  </div>


  <!-- ===== 浮動圖片 ===== -->

  <img
    src="../PT/alien.png"
    alt="外星人"
    class="floating-img img1"
  >

  <img
    src="../PT/planet.png"
    alt="行星"
    class="floating-img img3"
  >

  <!-- ===== Modal ===== -->

  <div
    id="modal-overlay"
    class="modal-overlay"
  >

    <div class="modal">

      <div id="modal-text">
        內容
      </div>

      <div id="modal-buttons"></div>

    </div>

  </div>


  <script>

    const products = {
      happy:   { name:'해피 메이커',       price:27999999 },
      candy:   { name:'노스텔지어 캔디',   price:12999999 },
      wrapper: { name:'포장지 12B357나',   price:9999999 },
      book:    { name:'네크로노미콘',       price:49999999 },
      help:    { name:'우리가 도움!',       price:66666666 }
    };

    const cartItems = [];
    let currentProductId = '';

    function won(value){
      return '₩' + value.toLocaleString('en-US');
    }

    function openModal(){
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function openConfirmModal(productId){
      currentProductId = productId;
      const product = products[productId];
      document.getElementById('modal-text').innerHTML =
        '장바구니에 추가하시겠습니까?<br>' +
        product.name + ' - ' + won(product.price);
      document.getElementById('modal-buttons').innerHTML = `
        <button class="btn-yes" onclick="confirmAdd()">YES</button>
        <button class="btn-no" onclick="closeModal()">NO</button>
      `;
      openModal();
    }

    function confirmAdd(){
      const product = products[currentProductId];
      if (!cartItems.includes(currentProductId)) {
        cartItems.push(currentProductId);
      }
      document.getElementById('modal-text').innerHTML =
        product.name + '<br>장바구니에 추가되었습니다!';
      document.getElementById('modal-buttons').innerHTML = `
        <button class="btn-no" onclick="closeModal()">닫기</button>
      `;
    }

    function showCart(){
      if (cartItems.length === 0) {
        document.getElementById('modal-text').innerHTML = '장바구니가 비어 있습니다.';
        document.getElementById('modal-buttons').innerHTML = `
          <button class="btn-no" onclick="closeModal()">닫기</button>
        `;
        openModal();
        return;
      }

      const total = cartItems.reduce(
        (sum, productId) => sum + products[productId].price,
        0
      );
      const qualifiesForDiscount = total >= 100000000;
      const finalTotal = qualifiesForDiscount ? Math.floor(total * 0.8) : total;
      const itemRows = cartItems.map(productId => {
        const product = products[productId];
        return `
          <div class="cart-row">
            <span>${product.name} -</span>
            <span class="price">${won(product.price)}</span>
          </div>`;
      }).join('');
      const discountRow = qualifiesForDiscount ? `
        <div class="discount-total">
          <span>※할인했다!※ :</span>
          <span class="price">${finalTotal.toLocaleString('en-US')}</span>
        </div>` : '';

      document.getElementById('modal-text').innerHTML = `
        <div>구매를 확정하시겠습니까?</div>
        <div class="cart-list">
          ${itemRows}
          <div class="cart-total">
            <span>=</span>
            <span class="price">${won(total)}</span>
          </div>
          ${discountRow}
        </div>`;
      document.getElementById('modal-buttons').innerHTML = `
        <button class="btn-yes" onclick="completePurchase()">구매 확정</button>
        <button class="btn-no" onclick="closeModal()">취소</button>
      `;
      openModal();
    }

    function completePurchase(){
      document.getElementById('modal-text').innerHTML =
        '這不是真正的宇宙購物中心，<br>你不可能在這裡購買任何商品' +
        '<br>如果你想認識一下本網站製作者：' +
        '<a href="https://www.facebook.com/XROBIST357" target="_blank">點我前往FB</a>';
      document.getElementById('modal-buttons').innerHTML = `
        <button class="btn-no" onclick="closeModal()">닫기</button>
      `;
    }

    function closeModal(){
      document.getElementById('modal-overlay').style.display = 'none';
    }

  </script>

</body>
</html>
