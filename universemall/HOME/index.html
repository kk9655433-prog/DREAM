<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>우주 쇼핑몰</title>

  <style>
    html,body{
      height:100%;
      margin:0;
      padding:0;
      background:#000;
    }

    body{
      background-image: url('../PT/background.gif');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      font-family: "MingLiU", "PMingLiU", "新細明體", serif;
    }

    .wrap{
      min-height:100%;
      position:relative;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-align:center;
      padding:4vh 4vw;
      box-sizing:border-box;
    }

    .title-svg{
      width:min(92vw,2200px);
      height:clamp(120px, 30vh, 580px);
      margin-bottom:-90px;
    }

    .subtext{
      color:#FFD93B;
      font-size:clamp(18px, 3.2vh, 28px);
      letter-spacing:1px;
      text-shadow:0 2px 8px rgba(0,0,0,0.9);
      font-family:"MingLiU", "PMingLiU", "新細明體", serif;
      margin-top:4px;
    }

    a.shop-link{
      display:inline-block;
      margin-top:6px;
      text-decoration:none;
      font-weight:1000;
      padding:10px 22px;
      border-radius:10px;
      background:linear-gradient(
        90deg,
        #ff9a3b,
        #ffd93b,
        #3bff7a,
        #3bb8ff,
        #b33bff
      );
      color:#000;
      box-shadow:0 6px 20px rgba(0,0,0,0.6);
      transition:transform .18s ease, box-shadow .18s ease;
    }

    a.shop-link:hover{
      transform:translateY(-4px);
      box-shadow:0 12px 30px rgba(0,0,0,0.5);
    }

    @keyframes rainbowShift{
      0%   { stop-color:#ff3b3b; }
      20%  { stop-color:#ff9a3b; }
      40%  { stop-color:#ffd93b; }
      60%  { stop-color:#3bff7a; }
      80%  { stop-color:#3bb8ff; }
      100% { stop-color:#b33bff; }
    }

    .floating-img{
      position:absolute;
      height:auto;
      max-width:40vw;
      z-index:1;
      pointer-events:none;
    }

    .img1{
      width:20vw;
      top:40%;
      right:10%;
    }

    .img2{
      width:clamp(110px, 24vw, 360px);
      position:fixed;
      top:0;
      left:0;
      will-change:transform;
    }

    .img3{
      width:28vw;
      top:60%;
      left:5%;
      transform:translateY(-50%);
    }
  </style>
</head>

<body>

  <div class="wrap">

    <svg
      class="title-svg"
      viewBox="0 0 1200 300"
      preserveAspectRatio="xMidYMid meet"
    >

      <defs>

        <linearGradient
          id="rainbow"
          x1="0%"
          y1="0%"
          x2="100%"
          y2="0%"
        >

          <stop offset="0%" stop-color="#ff3b3b">
            <animate
              attributeName="stop-color"
              values="#ff3b3b;#ff9a3b;#ffd93b;#3bff7a;#3bb8ff;#b33bff;#ff3b3b"
              dur="6s"
              repeatCount="indefinite"
            />
          </stop>

          <stop offset="50%" stop-color="#3bb8ff">
            <animate
              attributeName="stop-color"
              values="#3bb8ff;#b33bff;#ff3b3b;#ff9a3b;#ffd93b;#3bff7a;#3bb8ff"
              dur="6s"
              repeatCount="indefinite"
            />
          </stop>

          <stop offset="100%" stop-color="#b33bff">
            <animate
              attributeName="stop-color"
              values="#b33bff;#ff3b3b;#ff9a3b;#ffd93b;#3bff7a;#3bb8ff;#b33bff"
              dur="6s"
              repeatCount="indefinite"
            />
          </stop>

        </linearGradient>

        <path
          id="arcPath"
          d="M60,190 C300,60 900,60 1140,190"
          fill="none"
        />

        <filter id="glow">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

      </defs>

      <text
        font-family="MingLiU, PMingLiU, 新細明體, serif"
        font-size="120"
        font-weight="700"
        text-anchor="middle"
        filter="url(#glow)"
        fill="url(#rainbow)"
      >

        <textPath
          href="#arcPath"
          startOffset="50%"
          dominant-baseline="middle"
          letter-spacing="2"
        >
          우주 쇼핑몰
        </textPath>

      </text>

    </svg>

    <div class="subtext">

      <div>
        <u>
          ※재단장 기념 할인 행사!※
          <br>
          놀랍다 가격!
        </u>
      </div>

      <div style="margin-top:46px;">

        <a
          class="shop-link"
          href="../Shopping/index.html"
        >
          ＞＞나는 <i>물건</i>을 본다
        </a>

      </div>

    </div>

  </div>


  <!-- 外星人 -->
  <img
    src="../PT/alien.png"
    alt="外星人"
    class="floating-img img1"
  >

  <!-- UFO -->
  <img
    src="../PT/ufo.png"
    alt="UFO"
    class="floating-img img2"
  >

  <!-- 行星 -->
  <img
    src="../PT/planet.png"
    alt="行星"
    class="floating-img img3"
  >

  <script>
    // 讓 UFO 像螢幕保護程式一樣在視窗四邊反彈。
    const ufo = document.querySelector('.img2');
    let x = Math.random() * Math.max(0, innerWidth - ufo.offsetWidth);
    let y = Math.random() * Math.max(0, innerHeight - ufo.offsetHeight);
    let vx = 150;
    let vy = 110;
    let previousTime = performance.now();

    function moveUfo(now) {
      const seconds = Math.min((now - previousTime) / 1000, 0.05);
      previousTime = now;
      const maxX = Math.max(0, innerWidth - ufo.offsetWidth);
      const maxY = Math.max(0, innerHeight - ufo.offsetHeight);

      x += vx * seconds;
      y += vy * seconds;

      if (x <= 0 || x >= maxX) {
        x = Math.max(0, Math.min(x, maxX));
        vx *= -1;
      }
      if (y <= 0 || y >= maxY) {
        y = Math.max(0, Math.min(y, maxY));
        vy *= -1;
      }

      ufo.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      requestAnimationFrame(moveUfo);
    }

    requestAnimationFrame(moveUfo);
  </script>

</body>
</html>
